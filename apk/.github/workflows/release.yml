name: Build APK Rilis

# Jalankan manual dari tab Actions, atau otomatis saat membuat tag v*
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest      # 4 vCPU, 16 GB RAM — R8 lega
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Periksa Secrets sudah diisi
        env:
          U: ${{ secrets.SUPABASE_URL }}
          A: ${{ secrets.SUPABASE_ANON_KEY }}
          H: ${{ secrets.SUPABASE_HOST }}
          K: ${{ secrets.KEYSTORE_BASE64 }}
          P: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KURANG=""
          [ -z "$U" ] && KURANG="$KURANG SUPABASE_URL"
          [ -z "$A" ] && KURANG="$KURANG SUPABASE_ANON_KEY"
          [ -z "$H" ] && KURANG="$KURANG SUPABASE_HOST"
          [ -z "$K" ] && KURANG="$KURANG KEYSTORE_BASE64"
          [ -z "$P" ] && KURANG="$KURANG KEYSTORE_PASSWORD"
          if [ -n "$KURANG" ]; then
            echo "::error::Secret belum diisi:$KURANG"
            echo "Isi di Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          echo "Semua secret terisi."

      - name: Tulis kredensial
        env:
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_HOST:     ${{ secrets.SUPABASE_HOST }}
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Berkas ini tidak pernah masuk repo; hanya hidup selama job.
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nSUPABASE_HOST=%s\n' \
            "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "$SUPABASE_HOST" > secrets.properties

          # tr -d menghapus newline yang sering terbawa saat menyalin
          # base64 lewat kolom Secrets di browser.
          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > release.keystore

          if [ ! -s release.keystore ]; then
            echo "::error::KEYSTORE_BASE64 tidak valid — hasil decode kosong."
            exit 1
          fi

          printf 'storeFile=release.keystore\nstorePassword=%s\nkeyAlias=safebrowser\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

          # Gagal cepat kalau password salah, daripada menunggu R8 selesai
          # baru gagal di tahap signing.
          if ! keytool -list -keystore release.keystore \
               -storepass "$KEYSTORE_PASSWORD" -alias safebrowser >/dev/null 2>&1; then
            echo "::error::Keystore tidak bisa dibuka. Cek KEYSTORE_PASSWORD dan alias 'safebrowser'."
            exit 1
          fi
          echo "Keystore terbaca, alias 'safebrowser' ada."

      - name: Build APK rilis
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verifikasi keamanan APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          [ -f "$APK" ] || { echo "::error::APK tidak dihasilkan"; exit 1; }

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          GAGAL=0

          echo "### Hasil Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ukuran: $(du -h "$APK" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pemeriksaan | Hasil |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          lapor(){ echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"; }

          # (a) debuggable — kalau true, siapa pun bisa masuk lewat adb
          #     dan membuka URL ujian. Seluruh penguncian jadi percuma.
          if "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -q debuggable; then
            echo "::error::APK masih debuggable"
            lapor "Tidak debuggable" ":x: GAGAL"; GAGAL=1
          else
            echo "OK: tidak debuggable"
            lapor "Tidak debuggable" ":white_check_mark:"
          fi

          # (b) debug key sama di semua SDK Android — orang lain bisa
          #     membuat "update" palsu yang dianggap sah.
          if "$BT/apksigner" verify --print-certs "$APK" | grep -q "CN=Android Debug"; then
            echo "::error::ditandatangani debug key"
            lapor "Kunci rilis" ":x: GAGAL"; GAGAL=1
          else
            echo "OK: ditandatangani kunci rilis"
            lapor "Kunci rilis" ":white_check_mark:"
          fi

          # (c) versi
          VN=$("$BT/aapt2" dump badging "$APK" | grep -o "versionName='[^']*'" | cut -d"'" -f2)
          VC=$("$BT/aapt2" dump badging "$APK" | grep -o "versionCode='[^']*'" | cut -d"'" -f2)
          echo "Versi: $VN (code $VC)"
          lapor "Versi" "$VN (code $VC)"

          # (d) query lama membocorkan URL ujian hanya dengan tahu token
          DEX=$(unzip -p "$APK" 'classes*.dex' | strings)

          if echo "$DEX" | grep -q "rest/v1/tokens"; then
            echo "::error::query tabel tokens lama masih ada"
            lapor "Query bocor lama hilang" ":x: GAGAL"; GAGAL=1
          else
            echo "OK: query bocor lama tidak ada"
            lapor "Query bocor lama hilang" ":white_check_mark:"
          fi

          if echo "$DEX" | grep -qE "service_role|sb_secret_"; then
            echo "::error::service key bocor di APK"
            lapor "Service key aman" ":x: GAGAL"; GAGAL=1
          else
            echo "OK: service key tidak bocor"
            lapor "Service key aman" ":white_check_mark:"
          fi

          if echo "$DEX" | grep -q "rest/v1/rpc/"; then
            echo "OK: jalur RPC ada"
            lapor "Jalur RPC ada" ":white_check_mark:"
          else
            echo "::error::jalur RPC tidak ditemukan"
            lapor "Jalur RPC ada" ":x: GAGAL"; GAGAL=1
          fi

          "$BT/apksigner" verify --print-certs "$APK" \
            | grep -E "Signer #1 certificate (DN|SHA-256 digest)" || true

          exit $GAGAL

      - name: Ganti nama APK
        run: |
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          cp app/build/outputs/apk/release/app-release.apk \
             "SafeBrowser-${VN}-release.apk"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeBrowser-release-apk
          path: SafeBrowser-*-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Bersihkan kredensial
        if: always()
        run: rm -f release.keystore keystore.properties secrets.properties
