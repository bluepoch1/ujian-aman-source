plugins {
    id 'com.android.application'
}

// Kredensial dibaca dari secrets.properties (tidak di-commit), dengan
// secrets.defaults.properties sebagai cadangan agar build tetap jalan
// di mesin bersih / CI.
def secrets = new Properties()
def secretsFile = rootProject.file('secrets.properties')
def defaultsFile = rootProject.file('secrets.defaults.properties')
if (secretsFile.exists()) {
    secretsFile.withInputStream { secrets.load(it) }
} else if (defaultsFile.exists()) {
    defaultsFile.withInputStream { secrets.load(it) }
}

// Konfigurasi penandatanganan rilis. Berkas keystore.properties tidak
// ikut ke Git; tanpa berkas itu build debug tetap jalan, build release
// gagal dengan pesan yang jelas alih-alih diam-diam memakai debug key.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) { ksFile.withInputStream { ks.load(it) } }

android {
    namespace 'com.safebrowser.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.safebrowser.app"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "3.9.0"
        vectorDrawables.useSupportLibrary = true

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        buildConfigField "String", "SUPABASE_URL",
                "\"${secrets.getProperty('SUPABASE_URL', '')}\""
        buildConfigField "String", "SUPABASE_ANON_KEY",
                "\"${secrets.getProperty('SUPABASE_ANON_KEY', '')}\""
        buildConfigField "String", "SUPABASE_HOST",
                "\"${secrets.getProperty('SUPABASE_HOST', '')}\""
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    signingConfigs {
        release {
            if (ks.getProperty('storeFile')) {
                storeFile     rootProject.file(ks.getProperty('storeFile'))
                storePassword ks.getProperty('storePassword')
                keyAlias      ks.getProperty('keyAlias')
                keyPassword   ks.getProperty('keyPassword')
                // v2+v3: tanda tangan menyeluruh atas isi APK, jauh lebih
                // sulit dimodifikasi ulang daripada v1 (JAR signing).
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
            if (ks.getProperty('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.mlkit:face-detection:16.1.6'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
